[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tech-skills-br"
version = "0.1.0"
description = "Mapeamento de habilidades em anuncios de vagas de tecnologia no Brasil"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.optional-dependencies]
export = ["pandas==3.0.3", "pyarrow==24.0.0"]
publish = ["kagglehub==1.0.2", "kaggle==2.2.4"]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.15.17", "Jinja2==3.1.6"]

[project.scripts]
tech-skills-br = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["scraper*", "api*", "scripts*"]
exclude = ["api.web*"]

[tool.setuptools.package-data]
scraper = ["rules/*.yml"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]
"tests/api/*.py" = ["E402"]

[tool.coverage.run]
source = ["scraper", "api", "scripts"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
