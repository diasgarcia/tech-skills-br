  Nordeste:
    - nome: "Recife"
      uf: "PE"
      aliases: ["recife", "porto digital", "olinda", "jaboatao", "paulista"]
      serpapi_location: "Recife, State of Pernambuco, Brazil"
      theirstack_id: 3451940

    - nome: "Salvador"
      uf: "BA"
      aliases: ["salvador", "lauro de freitas", "camacari"]
      serpapi_location: "Salvador, State of Bahia, Brazil"
      theirstack_id: 3450554

    - nome: "Fortaleza"
      uf: "CE"
      aliases: ["fortaleza", "caucaia", "maracanau", "eusebio"]
      serpapi_location: "Fortaleza, State of Ceara, Brazil"
      theirstack_id: 3463930

  Centro-Oeste:
    - nome: "Brasília"
      uf: "DF"
      aliases: ["brasilia", "distrito federal", "taguatinga", "aguas claras", "ceilandia"]
      serpapi_location: "Brasilia, Federal District, Brazil"
      theirstack_id: 3469058

    - nome: "Goiânia"
      uf: "GO"
      aliases: ["goiania", "aparecida de goiania", "anapolis"]
      serpapi_location: "Goiania, State of Goias, Brazil"
      theirstack_id: 3463504

  Norte:
    - nome: "Manaus"
      uf: "AM"
      aliases: ["manaus", "polo industrial de manaus"]
      serpapi_location: "Manaus, State of Amazonas, Brazil"
      theirstack_id: 3457193

    - nome: "Belém"
      uf: "PA"
      aliases: ["belem", "ananindeua"]
      serpapi_location: "Belem, State of Para, Brazil"
      theirstack_id: 3467865

