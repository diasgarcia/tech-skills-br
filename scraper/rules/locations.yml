# Catalogo dos principais polos tecnologicos do Brasil por macrorregiao.
#
# Cada polo define:
#   nome: nome canonico da cidade/polo
#   uf: sigla do estado
#   aliases: variacoes de escrita para o classificador geografico (cidades/bairros/apelidos)
#   serpapi_location: string canonica usada pela SerpApi (Google Jobs)
#   theirstack_id: ID numerico do catalogo de localidades da TheirStack

regioes:
  Sudeste:
    - nome: "São Paulo"
      uf: "SP"
      aliases: ["sao paulo", "capital paulista", "grande sao paulo", "paulista", "alphaville", "barueri", "santo andre", "sao bernardo", "sao caetano", "osasco", "guarulhos"]
      serpapi_location: "Sao Paulo, State of Sao Paulo, Brazil"
      theirstack_id: 3448439

    - nome: "Campinas"
      uf: "SP"
      aliases: ["campinas", "regiao metropolitana de campinas", "hortolandia", "indaiatuba", "sumare", "paulinia"]
      serpapi_location: "Campinas, State of Sao Paulo, Brazil"
      theirstack_id: 3467865

    - nome: "Rio de Janeiro"
      uf: "RJ"
      aliases: ["rio de janeiro", "capital fluminense", "niteroi", "duque de caxias", "barra da tijuca"]
      serpapi_location: "Rio de Janeiro, State of Rio de Janeiro, Brazil"
      theirstack_id: 3451190

    - nome: "Belo Horizonte"
      uf: "MG"
      aliases: ["belo horizonte", "bh", "san pedro valley", "contagem", "betim", "nova lima"]
      serpapi_location: "Belo Horizonte, State of Minas Gerais, Brazil"
      theirstack_id: 3470127

  Sul:
    - nome: "Curitiba"
      uf: "PR"
      aliases: ["curitiba", "regiao metropolitana de curitiba", "sao jose dos pinhais", "araucaria"]
