      theirstack_id: 3464975

    - nome: "Florianópolis"
      uf: "SC"
      aliases: ["florianopolis", "floripa", "ilha do silicio", "sao jose", "palhoca", "joinville", "blumenau"]
      serpapi_location: "Florianopolis, State of Santa Catarina, Brazil"
      theirstack_id: 3463237

    - nome: "Porto Alegre"
      uf: "RS"
      aliases: ["porto alegre", "poa", "tecnopuc", "canoas", "sao leopoldo", "caxias do sul", "novo hamburgo"]
