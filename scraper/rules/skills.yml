# Tecnologias e habilidades procuradas nas vagas.
#
# Formato:  Nome Canônico: [alias, alias, ...]
# O nome canonico e o que aparece no grafico, no banco e no CSV; os aliases sao as
# formas como a tecnologia aparece escrita nas vagas.
#
# O texto e comparado em minusculas e sem acento, mas "#" e "+" sao preservados
# (para "C#" e "C++" nao virarem "c"). Pontos viram espaco: escreva "node js",
# nao "node.js". O casamento e por palavra/frase inteira -- "go" nao casa dentro
# de "Goiania", "java" nao casa dentro de "javascript".
#
# Aliases com letra maiuscula tambem casam preservando caixa no texto original
# (ex.: "pfSense" casa com "pfSense" e "pfsense"). Comecar o alias com "~"
# restringe a caixa exata: "~Go" casa com "Conhecimento de Go", mas nao com
# "go live", "GO" nem "golang".

