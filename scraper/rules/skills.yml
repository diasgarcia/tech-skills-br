# Tecnologias e habilidades procuradas nas vagas.
#
# Formato:  Nome Canônico: [alias, alias, ...]
# O nome canonico e o que aparece no grafico e no CSV; os aliases sao as formas
# como a tecnologia aparece escrita nas vagas.
#
# O texto e comparado em minusculas e sem acento, mas "#" e "+" sao preservados
# (para "C#" e "C++" nao virarem "c"). Pontos viram espaco: escreva "node js",
# nao "node.js". O casamento e por palavra/frase inteira -- "go" nao casa dentro
# de "Goiania", "java" nao casa dentro de "javascript".

