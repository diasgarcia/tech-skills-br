# Secoes tipicas de beneficios/termos nas descricoes de vagas.
#
# O extrator ignora o texto dessas secoes ate um novo titulo de conteudo.
# Assim, um bloco de beneficios pode aparecer antes dos requisitos.
#
# O corte vale SO para o extrator: a descricao completa continua sendo
# salva no banco/CSV. As strings sao comparadas no texto normalizado
# (minusculas, sem acento).
secoes_descarte:
  - beneficios
  - benefits
  - informacoes adicionais
  - o que oferecemos
  - what we offer
  - o que voce pode esperar
  - what to expect from us
  - como tornamos seu trabalho
  - remuneracao e beneficios
  - etapas do processo
  - sobre o processo seletivo
  - e os beneficios
  - conheca nossos beneficios
  - conheca os beneficios
  - beneficios para voce
  - beneficios oferecidos

