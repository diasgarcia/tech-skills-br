# Regras de classificacao por area de tecnologia.
#
# Como funciona:
#   - Para cada area, cada keyword vale um "peso".
#   - Keywords encontradas no TITULO valem `title_boost` vezes mais que no corpo
#     da descricao (o titulo e um sinal muito mais confiavel).
#   - A area com maior pontuacao vence; se ninguem passar de `min_score`,
#     a vaga cai em "Outros/TI Geral".
#
# Para ajustar: edite as listas abaixo. O texto e comparado sem acentos, em
# minusculas, com pontuacao virando espaco -- entao escreva as keywords assim
# ("ci cd" casa com "CI/CD", "banco de dados" casa com "Banco de Dados").
# Keywords com espaco sao casadas como frase; keywords de uma palavra sao
# casadas com limite de palavra (nao ha match parcial dentro de outra palavra).

settings:
  title_boost: 3.0
  # min_score 3.0 = uma keyword `peso_medio` no titulo. Abaixo disso a vaga cai
  # em "Outros". Nao baixe para 1.0: um unico "dados" solto no meio de uma
  # descricao longa passaria a definir a area da vaga.
  min_score: 3.0
  fallback_area: "Outros/TI Geral"

# Portao de relevancia: a busca dos portais e "solta" e devolve muita vaga que
# nao e de tecnologia ("Analista Contábil Jr", "Analista Fiscal Jr"...).
#
# O TITULO e o sinal confiavel; a descricao nem sempre e. O Vagas.com, por
# exemplo, so devolve um trecho de marketing da vaga, cheio de palavra generica
# ("sistemas", "aplicacao") que apareceria ate em vaga administrativa. Por isso
# ha duas listas com rigor diferente.
#
# Uma vaga passa no portao se:
#   1. o TITULO casar `tech_gate.titulo`, ou
#   2. o TITULO casar uma keyword `peso_alto` de qualquer area, ou
#   3. a DESCRICAO casar `tech_gate.descricao` ou uma keyword `peso_alto`.
# As demais sao descartadas e contadas como "nao-tech" no relatorio.
tech_gate:
  titulo: # sinais amplos -- confiaveis porque vem do titulo da vaga
    - ti
    - t i
    - tecnologia
    - tecnologia da informacao
    - sistemas
    - sistema
    - software
    - desenvolvimento
    - desenvolvedor
    - desenvolvedora
    - programador
    - programadora
    - programacao
    - developer
    - dev
    - computacao
    - informatica
    - engenharia de software
    - suporte tecnico
    - help desk
    - helpdesk
    - service desk
    - infraestrutura de ti
    - redes
    - servidores
    - banco de dados
    - tech

  # Contextos onde as palavras acima NAO significam tecnologia. Se o titulo casar
  # qualquer item daqui, a vaga e descartada mesmo que case `titulo` acima.
  # ("Pesquisa e Desenvolvimento" = P&D de industria; "Odontologia Digital" idem.)
  excluir:
    - pesquisa e desenvolvimento
    - desenvolvimento humano
    - desenvolvimento pessoal
    - desenvolvimento organizacional
    - desenvolvimento de negocios
    - desenvolvimento sustentavel
    - desenvolvimento infantil
    - desenvolvimento de produtos
    - desenvolvimento de novos produtos
    - desenvolvimento de materiais
    - desenvolvimento de embalagens
    - desenvolvimento de pessoas
    - treinamento e desenvolvimento
    - treinamento desenvolvimento
    - recursos humanos
    - programacao de gas
    - programacao de producao
    - programacao de manutencao
    - desenvolvimento de mercado
    - desenvolvimento comercial
    - tecnologia educacional
    - tecnologia de alimentos
    - tecnologia agricola
    - tecnologia textil
    - odontologia digital
    - marketing digital
    - seguranca do trabalho
    - tecnico em enfermagem
    - pedagogia
    - arquivologia
    - biomedicina
    - nutricao
    - fisioterapia
    - odontologia

  descricao: # sinais estritos -- precisam sobreviver ao boilerplate das descricoes
    - desenvolvimento de software
    - desenvolvedor
    - desenvolvedora
    - programador
    - linguagem de programacao
    - engenharia de software
    - banco de dados
    - codigo fonte
    - tecnologia da informacao
    - suporte tecnico
    - help desk

