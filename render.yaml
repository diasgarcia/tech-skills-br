# Deploy da API no Render (https://render.com).
#
# O disco do plano free e efemero: some a cada deploy e a cada vez que o
# servico acorda depois de hibernar. Por isso o banco NAO e versionado nem
# persistido -- ele e reconstruido do CSV em `seed/` toda vez que o servico
# sobe. Sao 182 linhas, leva ~1s.
#
# O scraper nao roda aqui de proposito: portais de vaga costumam bloquear IP
# de nuvem. O deploy serve um snapshot datado; para atualizar, rode o scraper
# na sua maquina e faca commit de um novo `seed/vagas.csv`.

services:
  - type: web
    name: vagas-tech-junior-api
    runtime: python
    plan: free
    region: oregon

    buildCommand: pip install -r requirements-api.txt

    # Reconstroi o banco a partir do snapshot e sobe a API.
    #
    # --recriar    estado limpo mesmo se sobrar disco de um boot anterior.
    # --referencia data real da coleta. Sem ela, as 8 vagas cujo portal
    #              informou data relativa ("Ontem", "Ha 3 dias") seriam
    #              calculadas contra a data do deploy e mudariam a cada
    #              redeploy. Atualize junto com o seed/vagas.csv.
    # 0.0.0.0      e nao 127.0.0.1, senao o Render nao alcanca o processo.
    startCommand: >-
      python scripts/import_csv.py --csv seed/vagas.csv --recriar
      --referencia 2026-08-03 &&
      uvicorn api.app:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.11"

  # Cron jobs que DISPARAM a coleta no GitHub Actions via API de dispatch.
  #
  # O agendador do GitHub tem atrasado/derrubado os crons nativos; aqui o
  # Render chama o workflow nos 3 horarios BRT (12:16, 17:16 e 22:16 UTC),
  # de segunda a sexta. A coleta continua rodando inteira no Actions.
  # Requer a variavel GH_TOKEN (PAT com permissao "Actions: write") no serviço.
  - type: cron
    name: dispara-coleta-09h
    runtime: python
    schedule: "16 12 * * 1-5"
    startCommand: bash scripts/trigger_scraper.sh
    envVars:
      - key: GH_TOKEN
        sync: false

  - type: cron
    name: dispara-coleta-14h
    runtime: python
    schedule: "16 17 * * 1-5"
    startCommand: bash scripts/trigger_scraper.sh
    envVars:
      - key: GH_TOKEN
        sync: false

  - type: cron
    name: dispara-coleta-19h
    runtime: python
    schedule: "16 22 * * 1-5"
    startCommand: bash scripts/trigger_scraper.sh
    envVars:
      - key: GH_TOKEN
        sync: false
