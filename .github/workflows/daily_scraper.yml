name: Coleta Diaria de Vagas (PIBIC)

on:
  # Sem crons nativos: o agendador do GitHub atrasava/derrubava as runs
  # (30min -> 5h -> drop). O gatilho agora e externo (cron-job.org chama a
  # API de dispatch nos horarios 09:16, 14:16 e 19:16 BRT), e o botao
  # manual continua disponivel.
  #
  # `origem` e `rodada` sao informados pelo cron-job.org no corpo do
  # dispatch e tornam a rotulagem do commit infalivel (relogio do runner
  # atrasa na fila). O botao manual usa o default (manual). Sem inputs
  # (config antiga), vale a heuristica do relogio como fallback.
  workflow_dispatch:
    inputs:
      origem:
        description: 'Origem do disparo'
        required: false
        default: 'manual'
        type: choice
        options:
          - manual
          - cron
      rodada:
        description: 'Rodada automatica do dia (1=09:16, 2=14:16, 3=19:16 BRT)'
        required: false
        default: ''
        type: string

concurrency:
  group: coleta-diaria
  cancel-in-progress: false

jobs:
  scrape-and-update:
    name: Mineracao e Consolidacao de Vagas
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Permite que o bot do GitHub commite as novas vagas
      pages: write     # Necessario para o artefato do Pages
      id-token: write

    steps:
    - name: 1. Baixar repositorio
      uses: actions/checkout@v4

    - name: 2. Registrar horario de inicio da rodada
      run: |
        # O horario de inicio e o fallback do rotulo do commit: a fonte da
        # verdade sao os inputs origem/rodada do dispatch (passo 7), e o
        # MINUTOS_BRT cobre dispatches antigos sem inputs. O horario e o
        # de INICIO da run (09h16/14h16/19h16 BRT), nao o de conclusao.
        echo "MINUTOS_BRT=$((10#$(TZ=America/Sao_Paulo date +'%H%M')))" >> "$GITHUB_ENV"
        echo "DATA_HOJE=$(TZ=America/Sao_Paulo date +'%d/%m/%Y')" >> "$GITHUB_ENV"

    - name: 3. Configurar Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: 4. Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt


    - name: 5. Coletar todas as fontes (limite natural de paginacao de cada uma)
      run: |
        # tee em vez de capturar em variavel: o log aparece ao vivo no
        # terminal da run (captura so exibiria no final).
        # Coleta sempre paralela, com a matriz de delays decidida em 05/09
        # a partir das medicoes: LinkedIn 0.5s (em teste a partir de 05/09;
        # 1000/termo foi provado a 1.0s), InfoJobs 2.0s (bloqueio suave
        # medido em rajada), Vagas.com 2.0s (Cloudflare no detalhe do mesmo
        # portal), Solides 2.0s (inalterado) e as demais fontes 1.0s (sem
        # evidencia de limite ate agora).
        FLAGS="--max-pages 200 --delay 1 --no-enrich --parallel-sources \
          --source-delay linkedin 0.5 \
          --source-delay infojobs 2 \
          --source-delay vagas 2 \
          --source-delay solides 2 \
          --source-delay gupy 1 \
          --source-delay trampos 1 \
          --source-delay geekhunter 1 \
          --source-delay abler 1 \
          --source-delay recrutei 1"
        python main.py $FLAGS 2>&1 | tee /tmp/coleta.log
        echo "BRUTAS=$(grep -oP 'Total bruto: \K[0-9]+' /tmp/coleta.log | tail -1)" >> "$GITHUB_ENV"
        echo "ELEGIVEIS=$(grep -oP 'RANKING DE AREAS -- \K[0-9]+' /tmp/coleta.log | tail -1)" >> "$GITHUB_ENV"
      env:
        PYTHONPATH: .

    - name: 6. Carregar historico, consolidar novas vagas e atualizar snapshot
      run: |
        python scripts/import_csv.py --csv seed/vagas.csv
        # Importa todos os CSVs da rodada, do mais antigo para o mais novo.
        OUT_RODADA=""
        for csv in $(ls -tr output/vagas_*.csv); do
          OUT_RODADA=$(python scripts/import_csv.py --csv "$csv")
          echo "$OUT_RODADA"
        done
        NOVAS=$(echo "$OUT_RODADA" | grep -oP 'Criadas[. ]+\K[0-9]+' | tail -1)
        ATUALIZADAS=$(echo "$OUT_RODADA" | grep -oP 'Atualizadas[. ]+\K[0-9]+' | tail -1)
        echo "NOVAS=${NOVAS:-0}" >> "$GITHUB_ENV"
        echo "ATUALIZADAS=${ATUALIZADAS:-0}" >> "$GITHUB_ENV"
        python -u scripts/enrich_outras_fontes.py 2>&1 | tee /tmp/enrich.log
        python -u scripts/enrich_descriptions.py 2>&1 | tee -a /tmp/enrich.log
        python scripts/reclassify_areas.py
        python scripts/export_seed.py
        # Graficos e relatorio so na rodada 1 (09:16): o snapshot e diario.
        if [ "${{ github.event.inputs.rodada }}" = "2" ] || [ "${{ github.event.inputs.rodada }}" = "3" ]; then
          python scripts/report_db.py --no-charts
          echo "GERAR_RELATORIO=0" >> "$GITHUB_ENV"
        else
          python scripts/report_db.py
          echo "GERAR_RELATORIO=1" >> "$GITHUB_ENV"
        fi
        python scripts/export_pages_data.py
        python scripts/resumo_commit.py \
          --brutas "$BRUTAS" --elegiveis "$ELEGIVEIS" \
          --novas "$NOVAS" --atualizadas "$ATUALIZADAS" \
          --log /tmp/enrich.log > /tmp/corpo_commit.txt

    - name: 7. Comitar e enviar dados atualizados para o GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        git add seed/vagas.csv api/web/
        if [ "$GERAR_RELATORIO" != "0" ]; then
          git add docs/relatorios/
        fi

        
        git diff --quiet && git diff --staged --quiet && exit 0

        # Rotulo do commit. A fonte da verdade sao os inputs do dispatch
        # (origem/rodada), enviados pelo cron-job.org. O horario de inicio
        # (MINUTOS_BRT, registrado no passo 2) fica como fallback para
        # dispatches antigos sem inputs.
        ORIGEM="${{ github.event.inputs.origem }}"
        RODADA="${{ github.event.inputs.rodada }}"
        if [ "$ORIGEM" = "cron" ] && { [ "$RODADA" = "1" ] || [ "$RODADA" = "2" ] || [ "$RODADA" = "3" ]; }; then
          MENSAGEM="chore(data): coleta automatizada de vagas [${DATA_HOJE}] - ${RODADA}"
        elif [ "$ORIGEM" = "manual" ]; then
          N=$(git log --format='%s' | grep -c "coleta automatizada de vagas \[${DATA_HOJE}\] - manual" || true)
          MENSAGEM="chore(data): coleta automatizada de vagas [${DATA_HOJE}] - manual $((N + 1))"
        elif [ "${MINUTOS_BRT}" -ge 916 ] && [ "${MINUTOS_BRT}" -le 921 ]; then
          MENSAGEM="chore(data): coleta automatizada de vagas [${DATA_HOJE}] - 1"
        elif [ "${MINUTOS_BRT}" -ge 1416 ] && [ "${MINUTOS_BRT}" -le 1421 ]; then
          MENSAGEM="chore(data): coleta automatizada de vagas [${DATA_HOJE}] - 2"
        elif [ "${MINUTOS_BRT}" -ge 1916 ] && [ "${MINUTOS_BRT}" -le 1921 ]; then
          MENSAGEM="chore(data): coleta automatizada de vagas [${DATA_HOJE}] - 3"
        else
          N=$(git log --format='%s' | grep -c "coleta automatizada de vagas \[${DATA_HOJE}\] - manual" || true)
          MENSAGEM="chore(data): coleta automatizada de vagas [${DATA_HOJE}] - manual $((N + 1))"
        fi
        # O corpo do commit traz o resumo da rodada (coleta, base,
        # enriquecidas e pendentes), gerado no passo 6.
        { echo "${MENSAGEM}"; echo; cat /tmp/corpo_commit.txt; } > /tmp/commit_msg.txt
        # Sem [skip ci]: o push em api/web/** precisa disparar o
        # deploy_pages.yml (o marcador suprimiria todos os workflows do push).
        git commit -F /tmp/commit_msg.txt
        COMMIT_BOT=$(git rev-parse HEAD)
        # Em caso de corrida com outro push, rebaseia e tenta de novo.
        # Se o rebase conflitar em arquivos de dados (seed, docs, api/web),
        # a versao do bot e a mais nova - vem do banco da propria run.
        # Refaz entao o commit por cima da main atual, reaplicando SOMENTE
        # os dados do bot: reset --soft do checkout antigo levaria junto o
        # codigo defasado do clone inicial e reverteria commits que
        # entraram no main durante a coleta (ja aconteceu na rodada - 2).
        for tentativa in 1 2 3; do
          if git pull --rebase origin main; then
            if git push; then
              exit 0
            fi
          else
            git rebase --abort 2>/dev/null || true
            git reset --hard origin/main
            git checkout "${COMMIT_BOT}" -- seed/vagas.csv api/web/
            git add seed/vagas.csv api/web/
            if [ "$GERAR_RELATORIO" != "0" ]; then
              git checkout "${COMMIT_BOT}" -- docs/relatorios/
              git add docs/relatorios/
            fi
            git commit -F /tmp/commit_msg.txt
          fi
          sleep 10
        done
        exit 1

    - name: 8. Montar artefato do GitHub Pages
      run: |
        mkdir -p _site/api
        cp .github/web/index.html _site/
        cp api/web/*.json _site/api/

    - name: 9. Preparar artefato do GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: '_site'

  deploy-pages:
    # Deploy interno: o push do bot usa GITHUB_TOKEN e NAO dispara o
    # deploy_pages.yml (eventos do GITHUB_TOKEN nao criam novos workflows),
    # entao a publicacao precisa acontecer aqui, no mesmo run.
    name: Publicar Dashboard no GitHub Pages
    needs: scrape-and-update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4



