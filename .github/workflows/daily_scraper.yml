name: Coleta Diaria de Vagas (PIBIC)

on:
  # Sem crons nativos: o agendador do GitHub atrasava/derrubava as runs
  # (30min -> 5h -> drop). O gatilho agora e externo (cron-job.org chama a
  # API de dispatch nos horarios 09:16, 14:16 e 19:16 BRT), e o botao
  # manual continua disponivel.
  workflow_dispatch:

concurrency:
  group: coleta-diaria
  cancel-in-progress: false

jobs:
  scrape-and-update:
    name: Mineracao e Consolidacao de Vagas
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Permite que o bot do GitHub commite as novas vagas
      pages: write     # Necessario para o artefato do Pages
      id-token: write

    steps:
    - name: 1. Baixar repositorio
      uses: actions/checkout@v4

    - name: 2. Configurar Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: 3. Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt


    - name: 4. Coletar todas as fontes (limite natural de paginacao de cada uma)
      run: |
        python main.py --max-pages 200 --delay 2 --no-enrich
      env:
        PYTHONPATH: .

    - name: 5. Carregar historico, consolidar novas vagas e atualizar snapshot
      run: |
        python scripts/import_csv.py --csv seed/vagas.csv
        # Importa todos os CSVs da rodada, do mais antigo para o mais novo.
        for csv in $(ls -tr output/vagas_*.csv); do python scripts/import_csv.py --csv "$csv"; done
        python scripts/enrich_outras_fontes.py
        python scripts/enrich_descriptions.py
        python scripts/reclassify_areas.py
        python scripts/export_seed.py
        python scripts/report_db.py
        python scripts/export_pages_data.py

    - name: 6. Comitar e enviar dados atualizados para o GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        git add seed/vagas.csv docs/relatorios/ api/web/ .github/web/

        
        DATA_HOJE=$(date +'%d/%m/%Y')
        git diff --quiet && git diff --staged --quiet && exit 0

        # Sufixo pela rodada (BRT): 09h16 -> - 1, 14h16 -> - 2, 19h16 -> - 3.
        # Tolerancia de +5 min depois de cada horario (o cron-job.org
        # nunca dispara antes); fora disso vira "- manual N".
        MINUTOS_BRT=$((10#$(TZ=America/Sao_Paulo date +'%H%M')))
        if [ "${MINUTOS_BRT}" -ge 916 ] && [ "${MINUTOS_BRT}" -le 921 ]; then
          MENSAGEM="chore(data): coleta automatizada de vagas [${DATA_HOJE}] - 1"
        elif [ "${MINUTOS_BRT}" -ge 1416 ] && [ "${MINUTOS_BRT}" -le 1421 ]; then
          MENSAGEM="chore(data): coleta automatizada de vagas [${DATA_HOJE}] - 2"
        elif [ "${MINUTOS_BRT}" -ge 1916 ] && [ "${MINUTOS_BRT}" -le 1921 ]; then
          MENSAGEM="chore(data): coleta automatizada de vagas [${DATA_HOJE}] - 3"
        else
          N=$(git log --format='%s' | grep -c "coleta automatizada de vagas \[${DATA_HOJE}\] - manual" || true)
          MENSAGEM="chore(data): coleta automatizada de vagas [${DATA_HOJE}] - manual $((N + 1))"
        fi
        # Sem [skip ci]: o push em api/web/** precisa disparar o
        # deploy_pages.yml (o marcador suprimiria todos os workflows do push).
        git commit -m "${MENSAGEM}"
        # Em caso de corrida com outro push, rebaseia e tenta de novo.
        # Se o rebase conflitar em arquivos de dados (seed, docs, api/web),
        # a versao do bot e a mais nova - vem do banco da propria run.
        # Refaz entao o commit por cima da main atual, com os dados do bot.
        for tentativa in 1 2 3; do
          if git pull --rebase origin main; then
            if git push; then
              exit 0
            fi
          else
            git rebase --abort 2>/dev/null || true
            git reset --soft origin/main
            git add seed/vagas.csv docs/relatorios/ api/web/ .github/web/
            git commit -m "${MENSAGEM}"
          fi
          sleep 10
        done
        exit 1

    - name: 7. Montar artefato do GitHub Pages
      run: |
        mkdir -p _site/api
        cp .github/web/index.html _site/
        cp api/web/*.json _site/api/

    - name: 8. Preparar artefato do GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: '_site'

  deploy-pages:
    # Deploy interno: o push do bot usa GITHUB_TOKEN e NAO dispara o
    # deploy_pages.yml (eventos do GITHUB_TOKEN nao criam novos workflows),
    # entao a publicacao precisa acontecer aqui, no mesmo run.
    name: Publicar Dashboard no GitHub Pages
    needs: scrape-and-update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4



