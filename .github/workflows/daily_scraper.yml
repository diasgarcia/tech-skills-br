name: Coleta Diaria de Vagas (PIBIC)

on:
  # Sem crons nativos: o agendador do GitHub atrasava/derrubava as runs
  # (30min -> 5h -> drop). O gatilho agora e externo (cron-job.org chama a
  # API de dispatch nos horarios 09:16, 14:16 e 19:16 BRT), e o botao
  # manual continua disponivel.
  workflow_dispatch:

concurrency:
  group: coleta-diaria
  cancel-in-progress: false

jobs:
  scrape-and-update:
    name: Mineracao e Consolidacao de Vagas
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Permite que o bot do GitHub commite as novas vagas

    steps:
    - name: 1. Baixar repositorio
      uses: actions/checkout@v4

    - name: 2. Configurar Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: 3. Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install --with-deps chromium


    - name: 4. Executar rodada comum gratuita (Gupy, LinkedIn, Vagas, ProgramaThor, Trampos)
      run: |
        # Sem enriquecimento de descricoes aqui: ele roda no passo 5,
        # apenas na primeira coleta do dia, so para vagas pendentes.
        python main.py --max-pages 10 --delay 2 --no-enrich
      env:
        PYTHONPATH: .

    - name: 5. Carregar historico, consolidar novas vagas e atualizar snapshot
      run: |
        # 1. Carrega o snapshot historico versionado no banco SQLite do runner:
        python scripts/import_csv.py --csv seed/vagas.csv
        # 2. Faz o UPSERT incremental das novas vagas mineradas na rodada:
        python scripts/import_csv.py
        # 3. Busca descricoes das vagas ainda pendentes (novas da rodada):
        python scripts/enrich_descriptions.py
        python scripts/enrich_outras_fontes.py
        # 4. Exporta a base acumulada e regenera os relatorios e graficos:
        python scripts/export_seed.py
        python scripts/report_db.py
        # 5. Exporta os endpoints JSON da API estatica para .github/pages/api:
        python scripts/export_pages_data.py

    - name: 6. Comitar e enviar dados atualizados para o GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        git add seed/vagas.csv docs/relatorios/ .github/pages/

        
        DATA_HOJE=$(date +'%d/%m/%Y')
        git diff --quiet && git diff --staged --quiet && exit 0
        git commit -m "chore(data): coleta automatizada de vagas [${DATA_HOJE}] [skip ci]"
        # Em caso de corrida com outro push, rebaseia e tenta de novo.
        # O pull --rebase so roda aqui, com o commit ja feito (arvore limpa).
        for tentativa in 1 2 3; do
          if git pull --rebase origin main && git push; then
            exit 0
          fi
          sleep 10
        done
        exit 1

    # Sem deploy aqui: o push em .github/pages/** dispara o workflow
    # deploy_pages.yml, que publica no GitHub Pages.



