name: Coleta Diaria de Vagas (PIBIC)

on:
  # Sem crons nativos: o agendador do GitHub atrasava/derrubava as runs
  # (30min -> 5h -> drop). O gatilho agora e externo (cron-job.org chama a
  # API de dispatch nos horarios 09:16, 14:16 e 19:16 BRT), e o botao
  # manual continua disponivel.
  workflow_dispatch:

concurrency:
  group: coleta-diaria
  cancel-in-progress: false

jobs:
  scrape-and-update:
    name: Mineracao e Consolidacao de Vagas
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Permite que o bot do GitHub commite as novas vagas
      pages: write     # Necessario para o artefato do Pages
      id-token: write

    steps:
    - name: 1. Baixar repositorio
      uses: actions/checkout@v4

    - name: 2. Configurar Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: 3. Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install --with-deps chromium


    - name: 4. Executar rodada comum gratuita (Gupy, LinkedIn, Vagas, ProgramaThor, Trampos)
      run: |
        python main.py --max-pages 10 --delay 2 --no-enrich
      env:
        PYTHONPATH: .

    - name: 5. Carregar historico, consolidar novas vagas e atualizar snapshot
      run: |
        python scripts/import_csv.py --csv seed/vagas.csv
        python scripts/import_csv.py
        # Outras fontes primeiro (ProgramaThor tem Cloudflare sensivel a
        # rajada; rodar cedo pega o IP com menos requests acumulados),
        # depois o LinkedIn.
        python scripts/enrich_outras_fontes.py
        python scripts/enrich_descriptions.py
        python scripts/reclassify_areas.py
        python scripts/export_seed.py
        python scripts/report_db.py
        python scripts/export_pages_data.py

    - name: 6. Comitar e enviar dados atualizados para o GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        git add seed/vagas.csv docs/relatorios/ .github/pages/

        
        DATA_HOJE=$(date +'%d/%m/%Y')
        git diff --quiet && git diff --staged --quiet && exit 0
        # Sem [skip ci]: o push em .github/pages/** precisa disparar o
        # deploy_pages.yml (o marcador suprimiria todos os workflows do push).
        git commit -m "chore(data): coleta automatizada de vagas [${DATA_HOJE}]"
        # Em caso de corrida com outro push, rebaseia e tenta de novo.
        # Se o rebase conflitar em arquivos de dados (seed, docs, pages),
        # a versao do bot e a mais nova - vem do banco da propria run.
        # Refaz entao o commit por cima da main atual, com os dados do bot.
        for tentativa in 1 2 3; do
          if git pull --rebase origin main; then
            if git push; then
              exit 0
            fi
          else
            git rebase --abort 2>/dev/null || true
            git reset --soft origin/main
            git add seed/vagas.csv docs/relatorios/ .github/pages/
            git commit -m "chore(data): coleta automatizada de vagas [${DATA_HOJE}]"
          fi
          sleep 10
        done
        exit 1

    - name: 7. Preparar artefato do GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.github/pages'

  deploy-pages:
    # Deploy interno: o push do bot usa GITHUB_TOKEN e NAO dispara o
    # deploy_pages.yml (eventos do GITHUB_TOKEN nao criam novos workflows),
    # entao a publicacao precisa acontecer aqui, no mesmo run.
    name: Publicar Dashboard no GitHub Pages
    needs: scrape-and-update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4



