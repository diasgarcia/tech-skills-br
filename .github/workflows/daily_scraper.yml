name: Coleta Diaria de Vagas (PIBIC)

on:
  schedule:
    # Executa de Segunda a Sexta-feira em 3 horarios BRT:
    # 09:16 BRT (12:16 UTC), 14:16 BRT (17:16 UTC) e 19:16 BRT (22:16 UTC).
    - cron: '16 12 * * 1-5'
    - cron: '16 17 * * 1-5'
    - cron: '16 22 * * 1-5'



  # Permite disparo manual com 1 clique pelo navegador:
  workflow_dispatch:

concurrency:
  group: coleta-diaria
  cancel-in-progress: false

jobs:
  scrape-and-update:
    name: Mineracao e Consolidacao de Vagas
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Permite que o bot do GitHub commite as novas vagas
      pages: write     # Permite deploy no GitHub Pages
      id-token: write  # Necessario para autenticacao do GitHub Pages

    steps:
    - name: 1. Baixar repositorio
      uses: actions/checkout@v4

    - name: 2. Configurar Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: 3. Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install --with-deps chromium


    - name: 4. Executar rodada comum gratuita (Gupy, LinkedIn, Vagas, ProgramaThor, Trampos)
      run: |
        # Sem enriquecimento de descricoes aqui: ele roda no passo 6, so para
        # vagas pendentes, evitando refazer requests de vagas ja salvas.
        python main.py --max-pages 10 --delay 2 --no-enrich
      env:
        PYTHONPATH: .

    - name: 5. Carregar historico, consolidar novas vagas e atualizar snapshot
      run: |
        # 1. Carrega o snapshot historico versionado no banco SQLite do runner:
        python scripts/import_csv.py --csv seed/vagas.csv
        # 2. Faz o UPSERT incremental das novas vagas mineradas na rodada:
        python scripts/import_csv.py
        # 3. Busca descricoes apenas das vagas do LinkedIn ainda pendentes:
        python scripts/enrich_descriptions.py
        # 4. Exporta a base acumulada e regenera os relatorios e graficos:
        python scripts/export_seed.py
        python scripts/report_db.py
        # 5. Exporta os endpoints JSON da API estatica para .github/pages/api:
        python scripts/export_pages_data.py

    - name: 6. Comitar e enviar dados atualizados para o GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        # Sincroniza com commits que possam ter entrado durante a coleta
        git pull --rebase origin main

        git add seed/vagas.csv docs/relatorios/ .github/pages/

        
        DATA_HOJE=$(date +'%d/%m/%Y')
        git diff --quiet && git diff --staged --quiet && exit 0
        git commit -m "chore(data): coleta automatizada de vagas [${DATA_HOJE}] [skip ci]"
        # Em caso de corrida com outro push, rebaseia e tenta de novo
        for tentativa in 1 2 3; do
          if git pull --rebase origin main && git push; then
            exit 0
          fi
          sleep 10
        done
        exit 1

    - name: 7. Preparar artefato do GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.github/pages'

  deploy-pages:
    name: Publicar Dashboard no GitHub Pages
    needs: scrape-and-update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4



