name: Coleta Diaria de Vagas (PIBIC)

on:
  # Sem crons nativos: o agendador do GitHub atrasava/derrubava as runs
  # (30min -> 5h -> drop). O gatilho agora e externo (cron-job.org chama a
  # API de dispatch nos horarios 09:16, 14:16 e 19:16 BRT), e o botao
  # manual continua disponivel.
  #
  # `origem` e `rodada` sao informados pelo cron-job.org no corpo do
  # dispatch. Somente cron com rodada 1, 2 ou 3 e automatico; qualquer
  # combinacao sem uma rodada valida e tratada como execucao manual.
  workflow_dispatch:
    inputs:
      origem:
        description: 'Origem do disparo'
        required: false
        default: 'manual'
        type: choice
        options:
          - manual
          - cron
      rodada:
        description: 'Rodada automatica do dia (1=09:16, 2=14:16, 3=19:16 BRT)'
        required: false
        default: ''
        type: string
      fontes:
        description: 'Fontes para coletar, separadas por espaco (vazio = todas)'
        required: false
        default: ''
        type: string

concurrency:
  group: coleta-diaria
  cancel-in-progress: false

jobs:
  scrape-and-update:
    name: Mineracao e Consolidacao de Vagas
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Permite que o bot do GitHub commite as novas vagas
      pages: write     # Necessario para o artefato do Pages
      id-token: write

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
    - name: 1. Baixar repositorio
      uses: actions/checkout@v4

    - name: 2. Registrar data da rodada
      run: |
        echo "DATA_HOJE=$(TZ=America/Sao_Paulo date +'%d/%m/%Y')" >> "$GITHUB_ENV"

    - name: 3. Configurar Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: 4. Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt


    - name: 5. Coletar todas as fontes (limite natural de paginacao de cada uma)
      run: |
        # tee em vez de capturar em variavel: o log aparece ao vivo no
        # terminal da run (captura so exibiria no final).
        # Os defaults vivem no codigo (scraper/config.py): coleta paralela
        # ligada e a matriz de delays por fonte (LinkedIn 1.0s; InfoJobs,
        # Vagas.com e Solides 2.0s; demais 1.0s - medido em 05/09, ver a
        # wiki "Limites e Bloqueios"). A CLI so passa o teto de paginas.
        FLAGS="--max-pages 200 --no-enrich"
        if [ -n "${{ github.event.inputs.fontes }}" ]; then
          FLAGS="$FLAGS --sources ${{ github.event.inputs.fontes }}"
        fi
        python main.py $FLAGS 2>&1 | tee /tmp/coleta.log
        echo "BRUTAS=$(grep -oP 'Total bruto: \K[0-9]+' /tmp/coleta.log | tail -1)" >> "$GITHUB_ENV"
        echo "ELEGIVEIS=$(grep -oP 'RANKING DE AREAS -- \K[0-9]+' /tmp/coleta.log | tail -1)" >> "$GITHUB_ENV"
      env:
        PYTHONPATH: .

    - name: 6. Carregar historico, consolidar novas vagas e atualizar snapshot
      run: |
        gh release download latest --pattern 'vagas.db' --dir data --clobber
        # Importa todos os CSVs da rodada, do mais antigo para o mais novo.
        OUT_RODADA=""
        for csv in $(ls -tr output/vagas_*.csv); do
          OUT_RODADA=$(python scripts/import_csv.py --csv "$csv")
          echo "$OUT_RODADA"
        done
        NOVAS=$(echo "$OUT_RODADA" | grep -oP 'Criadas[. ]+\K[0-9]+' | tail -1)
        ATUALIZADAS=$(echo "$OUT_RODADA" | grep -oP 'Atualizadas[. ]+\K[0-9]+' | tail -1)
        echo "NOVAS=${NOVAS:-0}" >> "$GITHUB_ENV"
        echo "ATUALIZADAS=${ATUALIZADAS:-0}" >> "$GITHUB_ENV"
        HASH_ANTES=$(sha256sum data/vagas.db | cut -d' ' -f1)
        python -u scripts/enrich_outras_fontes.py 2>&1 | tee /tmp/enrich.log
        python -u scripts/enrich_descriptions.py 2>&1 | tee -a /tmp/enrich.log
        python scripts/reclassify_areas.py
        # A partir daqui o banco nao muda: vagas.db + vagas.csv (release) e
        # o parquet (Kaggle) precisam ser o MESMO snapshot da rodada.
        python scripts/export_seed.py
        gh release upload latest data/vagas.db seed/vagas.csv --clobber
        ORIGEM_INPUT="$ORIGEM"
        RODADA_INPUT="$RODADA"
        if [ "$ORIGEM_INPUT" = "cron" ] && { [ "$RODADA_INPUT" = "1" ] || [ "$RODADA_INPUT" = "2" ] || [ "$RODADA_INPUT" = "3" ]; }; then
          EXECUCAO="cron"
          RODADA_EXECUCAO="$RODADA_INPUT"
          export RODADA="$RODADA_INPUT"
        else
          EXECUCAO="manual"
          RODADA_EXECUCAO="manual"
          export RODADA="manual"
        fi
        echo "EXECUCAO=$EXECUCAO" >> "$GITHUB_ENV"
        echo "RODADA_EXECUCAO=$RODADA_EXECUCAO" >> "$GITHUB_ENV"

        # O relatorio e os graficos do README sao atualizados na rodada 3
        # (19:16 BRT) ou quando a coleta e tratada como manual.
        if [ "$EXECUCAO" = "manual" ] || [ "$RODADA_INPUT" = "3" ]; then
          python scripts/report_db.py
          echo "ATUALIZAR_RESUMOS=1" >> "$GITHUB_ENV"
        else
          echo "ATUALIZAR_RESUMOS=0" >> "$GITHUB_ENV"
        fi
        python scripts/export_pages_data.py
        MUDOU=0
        [ "${NOVAS:-0}" -gt 0 ] && MUDOU=1
        [ "${ATUALIZADAS:-0}" -gt 0 ] && MUDOU=1
        HASH_DEPOIS=$(sha256sum data/vagas.db | cut -d' ' -f1)
        [ "$HASH_ANTES" != "$HASH_DEPOIS" ] && MUDOU=1
        if [ "$MUDOU" = "1" ]; then
          pip install pandas pyarrow kagglehub kaggle
          # A release e o estado operacional. O Kaggle e uma replica: se
          # ele nao confirmar a versao depois da espera do script, a coleta
          # continua e deixa um aviso visivel para retomar a publicacao.
          if ! python scripts/export_kaggle.py; then
            echo "KAGGLE_PRONTO=0" >> "$GITHUB_ENV"
            echo "::warning title=Kaggle nao confirmado::A release foi atualizada, mas o Kaggle nao confirmou a nova versao. Execute o workflow Publicar Snapshot no Kaggle para tentar de novo."
            {
              echo "## Aviso: Kaggle nao confirmado"
              echo "A release latest foi atualizada. O Kaggle nao confirmou a nova versao apos a espera automatica."
              echo "Use o workflow **Publicar Snapshot no Kaggle** para repetir apenas a replica."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "KAGGLE_PRONTO=1" >> "$GITHUB_ENV"
          fi
        else
          echo "Kaggle: nada mudou nesta rodada; nenhuma versao nova."
          echo "KAGGLE_PRONTO=1" >> "$GITHUB_ENV"
        fi
        python scripts/resumo_commit.py \
          --brutas "$BRUTAS" --elegiveis "$ELEGIVEIS" \
          --novas "$NOVAS" --atualizadas "$ATUALIZADAS" \
          --log /tmp/enrich.log > /tmp/corpo_commit.txt
      env:
        PYTHONPATH: .
        KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        ORIGEM: ${{ github.event.inputs.origem }}
        RODADA: ${{ github.event.inputs.rodada }}
        DATA_HOJE: ${{ env.DATA_HOJE }}

    - name: 7. Atualizar notebook diario no Kaggle
      if: env.EXECUCAO == 'cron' && env.RODADA_EXECUCAO == '3' && env.KAGGLE_PRONTO == '1'
      continue-on-error: true
      run: |
        python -m pip install --upgrade kaggle
        kaggle kernels push --path notebooks/kaggle --timeout 900
        for tentativa in {1..90}; do
          ESTADO=$(kaggle kernels status rafaeldiasgarcia/tech-skills-brasil-analise-diaria 2>&1)
          echo "$ESTADO"

          if echo "$ESTADO" | grep -Eqi 'status "[^"]*(complete|completed)[^"]*"'; then
            exit 0
          fi

          if echo "$ESTADO" | grep -Eqi 'status "[^"]*(error|failed|cancel)[^"]*"'; then
            kaggle kernels logs rafaeldiasgarcia/tech-skills-brasil-analise-diaria || true
            exit 1
          fi

          sleep 10
        done

        echo "::error title=Notebook sem confirmacao::O Kaggle nao concluiu o notebook em 15 minutos."
        exit 1
      env:
        KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    - name: 8. Comitar e enviar dados atualizados para o GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        # O estado operacional vive no asset vagas.db do release "latest";
        # no git entra so o relatorio .md da rodada 3 ou de uma coleta manual (#24).
        if [ "$ATUALIZAR_RESUMOS" = "1" ]; then
          git add docs/relatorios/*.md
        fi

        # So importa o que foi staged: nas rodadas automaticas 1/2 nao ha
        # arquivo do relatorio para commitar.
        git diff --staged --quiet && exit 0

        # Somente cron com rodada valida recebe o rotulo automatico.
        # Cron sem rodada (ou com valor invalido) usa o fluxo manual.
        if [ "$EXECUCAO" = "cron" ]; then
          MENSAGEM="chore(data): coleta automatizada de vagas [${DATA_HOJE}] - ${RODADA_EXECUCAO}"
        else
          N=$(git log --format='%s' | grep -c "coleta automatizada de vagas \[${DATA_HOJE}\] - manual" || true)
          MENSAGEM="chore(data): coleta automatizada de vagas [${DATA_HOJE}] - manual $((N + 1))"
        fi
        # O corpo do commit traz o resumo da rodada (coleta, base,
        # enriquecidas e pendentes), gerado no passo 6.
        { echo "${MENSAGEM}"; echo; cat /tmp/corpo_commit.txt; } > /tmp/commit_msg.txt
        # Sem [skip ci]: o push em api/web/** precisa disparar o
        # deploy_pages.yml (o marcador suprimiria todos os workflows do push).
        git commit -F /tmp/commit_msg.txt
        COMMIT_BOT=$(git rev-parse HEAD)
        # Em caso de corrida com outro push, rebaseia e tenta de novo.
        # Se o rebase conflitar no relatorio, a versao do bot e a mais
        # nova - vem do banco da propria run.
        for tentativa in 1 2 3; do
          if git pull --rebase origin main; then
            if git push; then
              exit 0
            fi
          else
            git rebase --abort 2>/dev/null || true
            git reset --hard origin/main
            if [ "$ATUALIZAR_RESUMOS" = "1" ]; then
              git checkout "${COMMIT_BOT}" -- docs/relatorios/*.md
              git add docs/relatorios/*.md
            fi
            git commit -F /tmp/commit_msg.txt
          fi
          sleep 10
        done
        exit 1

    - name: 9. Montar artefato do GitHub Pages
      run: |
        mkdir -p _site/api _site/assets
        cp .github/web/index.html _site/
        cp api/web/*.json _site/api/
        if [ "$ATUALIZAR_RESUMOS" = "1" ]; then
          python scripts/export_readme_charts.py --output-dir _site/assets
        else
          # O Pages e publicado em toda rodada para atualizar a API JSON.
          # Preserve os graficos publicados ate a rodada 3.
          for arquivo in vagas-habilidades-30d.svg areas-habilidades.svg; do
            curl --fail --silent --show-error --location --retry 3 \
              "https://diasgarcia.github.io/tech-skills-br/assets/${arquivo}" \
              --output "_site/assets/${arquivo}"
          done
        fi

    - name: 10. Preparar artefato do GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: '_site'

  deploy-pages:
    # Deploy interno: o push do bot usa GITHUB_TOKEN e NAO dispara o
    # deploy_pages.yml (eventos do GITHUB_TOKEN nao criam novos workflows),
    # entao a publicacao precisa acontecer aqui, no mesmo run.
    name: Publicar Dashboard no GitHub Pages
    needs: scrape-and-update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4



