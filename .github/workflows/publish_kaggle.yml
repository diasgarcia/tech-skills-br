name: Publicar Snapshot no Kaggle

on:
  workflow_dispatch:

jobs:
  publish:
    name: Exportar release para o Kaggle
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      GH_TOKEN: ${{ github.token }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      PYTHONPATH: .

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pandas pyarrow kagglehub kaggle

      - name: Baixar snapshot da release
        run: gh release download latest --pattern 'vagas.db' --dir data --clobber

      - name: Definir data da versão no Brasil
        run: echo "DATA_HOJE=$(TZ=America/Sao_Paulo date +'%d/%m/%Y')" >> "$GITHUB_ENV"

      - name: Publicar snapshot no Kaggle
        run: python scripts/export_kaggle.py
