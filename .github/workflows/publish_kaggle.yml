name: Publicar Snapshot no Kaggle

on:
  workflow_dispatch:

concurrency:
  group: vagas-snapshot-latest
  cancel-in-progress: false

jobs:
  publish:
    name: Exportar release para o Kaggle
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      GH_TOKEN: ${{ github.token }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      PYTHONPATH: .

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[export,publish]'

      - name: Baixar snapshot da release
        run: python scripts/release_snapshot.py download --allow-legacy

      - name: Definir data da versão no Brasil
        run: echo "DATA_HOJE=$(TZ=America/Sao_Paulo date +'%d/%m/%Y')" >> "$GITHUB_ENV"

      - name: Publicar snapshot no Kaggle
        run: python scripts/export_kaggle.py
