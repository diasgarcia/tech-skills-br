name: Publicar Notebook de Analise no Kaggle

on:
  workflow_dispatch:

jobs:
  publish:
    name: Criar ou atualizar notebook
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar cliente do Kaggle
        run: python -m pip install --upgrade kaggle

      - name: Publicar e executar notebook
        run: kaggle kernels push --path notebooks/kaggle --timeout 900

      - name: Aguardar resultado da execucao
        run: |
          for tentativa in {1..90}; do
            ESTADO=$(kaggle kernels status rafaeldiasgarcia/tech-skills-brasil-an-lise-di-ria 2>&1)
            echo "$ESTADO"

            if echo "$ESTADO" | grep -Eqi 'status "[^"]*(complete|completed)[^"]*"'; then
              exit 0
            fi

            if echo "$ESTADO" | grep -Eqi 'status "[^"]*(error|failed|cancel)[^"]*"'; then
              kaggle kernels logs rafaeldiasgarcia/tech-skills-brasil-an-lise-di-ria || true
              exit 1
            fi

            sleep 10
          done

          echo "::error title=Notebook sem confirmacao::O Kaggle nao concluiu o notebook em 15 minutos."
          exit 1
