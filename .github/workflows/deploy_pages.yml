name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'api/web/**'
      - '.github/web/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 1. Baixar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: 3. Montar artefato do Pages
        run: |
          mkdir -p _site/api
          cp .github/web/index.html _site/
          cp api/web/*.json _site/api/

      - name: 4. Preparar artefato do Pages (_site)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: 5. Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
