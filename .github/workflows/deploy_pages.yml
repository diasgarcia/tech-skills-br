name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'api/web/**'
      - '.github/web/**'
      - 'scraper/charts.py'
      - 'scripts/export_readme_charts.py'
      - '.github/workflows/deploy_pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 1. Baixar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: 3. Montar artefato do Pages
        run: |
          # Os JSONs nao sao commitados (#24): baixa o banco do release
          # e gera os JSONs antes de montar o _site.
          gh release download latest --pattern 'vagas.db' --dir data --clobber
          pip install -r requirements.txt
          python scripts/export_pages_data.py
          mkdir -p _site/api _site/assets
          cp .github/web/index.html _site/
          cp api/web/*.json _site/api/
          # Este deploy atualiza o site e a API, mas preserva os graficos.
          # Os SVGs sao recalculados apenas na rodada 3 da coleta diaria.
          for arquivo in vagas-habilidades-30d.svg areas-habilidades.svg; do
            curl --fail --silent --show-error --location --retry 3 \
              "https://diasgarcia.github.io/tech-skills-br/assets/${arquivo}" \
              --output "_site/assets/${arquivo}"
          done

      - name: 4. Preparar artefato do Pages (_site)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: 5. Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
