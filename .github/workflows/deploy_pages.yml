name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'api/web/**'
      - '.github/web/**'
      - 'scraper/charts.py'
      - 'scripts/export_readme_charts.py'
      - '.github/workflows/deploy_pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vagas-snapshot-latest
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 1. Baixar repositorio
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 2. Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: 3. Montar artefato do Pages
        run: |
          # O Pages publica somente arquivos estaticos. Ele usa o banco do
          # release como entrada, sem participar do fluxo de snapshots.
          mkdir -p data
          gh release download latest --pattern 'vagas.db' --dir data --clobber
          pip install --disable-pip-version-check 'SQLAlchemy==2.0.52'
          python scripts/export_pages_data.py --db data/vagas.db
          python scripts/build_pages.py
          # Este deploy atualiza o site e a API, mas preserva os graficos.
          # Os SVGs sao recalculados na rodada 3 ou nas coletas manuais.
          for arquivo in vagas-habilidades-30d.svg areas-habilidades.svg; do
            curl --fail --silent --show-error --location --retry 3 \
              "https://diasgarcia.github.io/tech-skills-br/assets/${arquivo}" \
              --output "_site/assets/${arquivo}"
          done

      - name: 4. Preparar artefato do Pages (_site)
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: 5. Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
